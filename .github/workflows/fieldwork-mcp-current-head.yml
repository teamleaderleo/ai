name: Fieldwork MCP current-head verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fieldwork-mcp-current-head.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8c3e306c256c178429eefcc4fdfff0a1477efe6
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install exact lockfile
        run: pnpm install --frozen-lockfile
      - name: Verify exact identity and fence
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c8c3e306c256c178429eefcc4fdfff0a1477efe6
          git diff --check 3bc0d4f40df7a77af4b181bc97dc1c54843545ab..HEAD
          mapfile -t files < <(git diff --name-only 3bc0d4f40df7a77af4b181bc97dc1c54843545ab..HEAD | sort)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | grep -qx '.changeset/clean-mcp-inbound-sse-lifecycle.md'
          printf '%s\n' "${files[@]}" | grep -qx 'packages/mcp/src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts'
          printf '%s\n' "${files[@]}" | grep -qx 'packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts'
          printf '%s\n' "${files[@]}" | grep -qx 'packages/mcp/src/tool/mcp-http-transport.ts'
      - name: MCP package tests
        run: pnpm --filter @ai-sdk/mcp test
      - name: MCP package type-check
        run: pnpm --filter @ai-sdk/mcp type-check
      - name: MCP package build
        run: pnpm --filter @ai-sdk/mcp build
      - name: Focused formatting and lint
        shell: bash
        run: |
          pnpm exec oxfmt --check \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts
          pnpm exec oxlint \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts
      - name: Clean-tree check
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --porcelain)"

  retire:
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Retire carrier
        shell: bash
        run: |
          set -euo pipefail
          if test -f .github/workflows/fieldwork-mcp-current-head.yml; then
            git config user.name fieldwork-bot
            git config user.email fieldwork-bot@users.noreply.github.com
            git rm .github/workflows/fieldwork-mcp-current-head.yml
            git commit -m "Retire MCP current-head verification carrier"
            git push origin HEAD:main
          fi
