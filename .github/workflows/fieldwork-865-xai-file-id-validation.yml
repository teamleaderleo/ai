name: Fieldwork 865 xAI file ID validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check xAI
        run: pnpm --filter @ai-sdk/xai type-check

      - name: Build xAI
        run: pnpm --filter @ai-sdk/xai build

      - name: Run focused xAI file ID controls
        run: pnpm --filter @ai-sdk/xai test:node -- src/xai-video-file-id-inputs.test.ts

      - name: Run xAI Node suite
        run: pnpm --filter @ai-sdk/xai test:node
