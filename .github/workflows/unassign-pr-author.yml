name: Disable fork PR author assignment

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  disable-and-clean:
    if: >-
      github.repository == 'teamleaderleo/ai' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'maintenance/disable-pr-author-assignment'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Disable inherited author-assignment workflow
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/323294038/disable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove PR authors from existing assignments
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(. as $pr | [$pr.assignees[].login] | index($pr.user.login)) | [.number, .user.login] | @tsv' \
            | while IFS=$'\t' read -r number author; do
                gh api --method DELETE \
                  "repos/$GITHUB_REPOSITORY/issues/$number/assignees" \
                  -f "assignees[]=$author" >/dev/null
              done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
