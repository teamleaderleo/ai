name: Fieldwork 872 zero seed family validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check candidate formatting
        run: >-
          pnpm exec oxfmt --check
          .changeset/zero-media-seeds.md
          packages/fal/src/fal-video-model.ts
          packages/fal/src/fal-video-zero-seed.test.ts
          packages/google/src/google-video-model.ts
          packages/google/src/google-video-zero-seed.test.ts
          packages/google-vertex/src/google-vertex-video-model.ts
          packages/google-vertex/src/google-vertex-video-zero-seed.test.ts
          packages/gateway/src/gateway-image-model.ts
          packages/gateway/src/gateway-image-zero-seed.test.ts

      - name: Type-check affected providers
        run: |
          pnpm --filter @ai-sdk/fal type-check
          pnpm --filter @ai-sdk/google type-check
          pnpm --filter @ai-sdk/google-vertex type-check
          pnpm --filter @ai-sdk/gateway type-check

      - name: Build affected providers
        run: |
          pnpm --filter @ai-sdk/fal build
          pnpm --filter @ai-sdk/google build
          pnpm --filter @ai-sdk/google-vertex build
          pnpm --filter @ai-sdk/gateway build

      - name: Run focused zero-seed controls
        run: |
          pnpm --filter @ai-sdk/fal test:node -- src/fal-video-zero-seed.test.ts
          pnpm --filter @ai-sdk/google test:node -- src/google-video-zero-seed.test.ts
          pnpm --filter @ai-sdk/google-vertex test:node -- src/google-vertex-video-zero-seed.test.ts
          pnpm --filter @ai-sdk/gateway test:node -- src/gateway-image-zero-seed.test.ts

      - name: Run affected provider Node suites
        run: |
          pnpm --filter @ai-sdk/fal test:node
          pnpm --filter @ai-sdk/google test:node
          pnpm --filter @ai-sdk/google-vertex test:node
          pnpm --filter @ai-sdk/gateway test:node
