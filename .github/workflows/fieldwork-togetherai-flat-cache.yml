name: Fieldwork TogetherAI flat cache usage

on:
  pull_request:
    branches:
      - candidate/togetherai-flat-cached-usage

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: execution/togetherai-flat-cached-usage
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify candidate and carrier fences
        shell: bash
        run: |
          set -euo pipefail
          BASE=8e9028317de6a72973971356283271aff44bba74
          CANDIDATE=753e7082e77779dee855ea8e83e13c592c7d3ac8
          test "$(git rev-parse $CANDIDATE^)" = "$BASE"
          git diff --check "$BASE"..."$CANDIDATE"
          git diff --name-only "$BASE"..."$CANDIDATE" | sort > /tmp/candidate-actual
          printf '%s\n' \
            .changeset/together-cached-usage.md \
            packages/togetherai/src/convert-togetherai-chat-usage.test.ts \
            packages/togetherai/src/convert-togetherai-chat-usage.ts \
            packages/togetherai/src/togetherai-provider.ts \
            | sort > /tmp/candidate-expected
          diff -u /tmp/candidate-expected /tmp/candidate-actual

          git diff --check "$CANDIDATE"...HEAD
          git diff --name-only "$CANDIDATE"...HEAD | sort > /tmp/carrier-actual
          printf '%s\n' \
            .github/workflows/fieldwork-togetherai-flat-cache.yml \
            packages/togetherai/src/togetherai-flat-cached-usage.fieldwork.test.ts \
            | sort > /tmp/carrier-expected
          diff -u /tmp/carrier-expected /tmp/carrier-actual
      - run: pnpm install --frozen-lockfile
      - name: Repository code consistency
        run: pnpm konsistent
      - name: TogetherAI type check
        run: pnpm -C packages/togetherai type-check
      - name: TogetherAI Node tests
        run: pnpm -C packages/togetherai test:node
      - name: TogetherAI Edge tests
        run: pnpm -C packages/togetherai test:edge
      - name: Build TogetherAI package
        run: pnpm -C packages/togetherai build
