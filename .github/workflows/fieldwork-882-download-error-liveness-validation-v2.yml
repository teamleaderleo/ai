name: Fieldwork 882 download error liveness validation v2

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check candidate formatting
        run: >-
          pnpm exec oxfmt --check
          .changeset/download-error-cleanup-liveness.md
          packages/provider-utils/src/download-blob.ts
          packages/provider-utils/src/download-blob-error-cleanup-liveness.test.ts

      - name: Type-check provider-utils
        run: pnpm --filter @ai-sdk/provider-utils type-check

      - name: Build provider-utils
        run: pnpm --filter @ai-sdk/provider-utils build

      - name: Run focused liveness regression
        run: pnpm --filter @ai-sdk/provider-utils test:node -- src/download-blob-error-cleanup-liveness.test.ts

      - name: Run existing download tests
        run: pnpm --filter @ai-sdk/provider-utils test:node -- src/download-blob.test.ts src/cancel-response-body.test.ts

      - name: Run provider-utils Node suite
        run: pnpm --filter @ai-sdk/provider-utils test:node
