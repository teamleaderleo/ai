name: Apply core video abort arbitration

on:
  pull_request:
    branches:
      - research/base-main-1bec
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'fix/core-video-operation-deadline-1bec'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURCE_BASE: 1bec07d118baccb985f893e96ea0a1860063f4dc
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-video-operation-deadline-1bec
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace
        run: pnpm install --frozen-lockfile

      - name: Apply missing caller-abort arbitration repair
        run: python3 .github/scripts/apply-core-video-abort-arbitration.py

      - name: Format candidate
        run: |
          pnpm exec oxfmt \
            packages/ai/src/generate-video/generate-video.ts \
            packages/ai/src/generate-video/core-video-operation-deadline.test.ts \
            .changeset/quiet-snails-own.md

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Run Node video deadline and compatibility suites
        run: |
          pnpm -C packages/ai exec vitest --config vitest.node.config.js --run \
            src/generate-video/core-video-operation-deadline.test.ts \
            src/generate-video/generate-video.test.ts

      - name: Run Edge video deadline and compatibility suites
        run: |
          pnpm -C packages/ai exec vitest --config vitest.edge.config.js --run \
            src/generate-video/core-video-operation-deadline.test.ts \
            src/generate-video/generate-video.test.ts

      - name: Verify materialized source worktree
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          expected=(
            packages/ai/src/generate-video/core-video-operation-deadline.test.ts
            packages/ai/src/generate-video/generate-video.ts
          )
          printf 'materialized files:\n%s\n' "${changed[*]}"
          test "${changed[*]}" = "${expected[*]}"

      - name: Publish corrected product head
        run: |
          set -euo pipefail
          rm .github/scripts/apply-core-video-abort-arbitration.py
          rm .github/workflows/apply-core-video-abort-arbitration.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A

          mapfile -t staged < <(git diff --cached --name-only | sort)
          expected_commit=(
            .github/scripts/apply-core-video-abort-arbitration.py
            .github/workflows/apply-core-video-abort-arbitration.yml
            packages/ai/src/generate-video/core-video-operation-deadline.test.ts
            packages/ai/src/generate-video/generate-video.ts
          )
          printf 'publication commit files:\n%s\n' "${staged[*]}"
          test "${staged[*]}" = "${expected_commit[*]}"

          git commit -m "fix(ai): preserve caller abort authority during video polling"

          mapfile -t final < <(git diff --name-only "$SOURCE_BASE"..HEAD | sort)
          expected_product=(
            .changeset/quiet-snails-own.md
            packages/ai/src/generate-video/core-video-operation-deadline.test.ts
            packages/ai/src/generate-video/generate-video.ts
          )
          printf 'final product files:\n%s\n' "${final[*]}"
          test "${final[*]}" = "${expected_product[*]}"

          git push origin HEAD:fix/core-video-operation-deadline-1bec
