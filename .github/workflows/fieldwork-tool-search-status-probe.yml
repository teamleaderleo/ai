name: Fieldwork client tool-search status probe

on:
  push:
    branches:
      - carrier/native-openai-incomplete-tool-search-execution-20260812

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile >/dev/null
      - run: pnpm build:packages >/dev/null
      - name: Capture receipt
        run: pnpm -C examples/ai-functions exec tsx src/reproduction/fieldwork-native-openai-incomplete-tool-search.ts > tool-search-status-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: tool-search-status-receipt
          path: tool-search-status-receipt.json
