name: Fieldwork format resumable Stop candidate

on:
  push:
    branches:
      - fieldwork/reset-resumable-stop-state
    paths:
      - .github/workflows/fieldwork-format-resumable-stop.yml

permissions:
  contents: write

concurrency:
  group: fieldwork-format-resumable-stop
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/reset-resumable-stop-state
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply repository formatter
        run: |
          pnpm exec ultracite fix \
            examples/next/app/api/chat/route.ts \
            examples/next/util/chat-store.ts \
            examples/next/util/chat-store.test.ts
          pnpm exec ultracite check \
            examples/next/app/api/chat/route.ts \
            examples/next/util/chat-store.ts \
            examples/next/util/chat-store.test.ts
          git diff --check

      - name: Publish formatted source and remove carrier
        run: |
          rm .github/workflows/fieldwork-format-resumable-stop.yml
          git config user.name fieldwork-bot
          git config user.email fieldwork-bot@users.noreply.github.com
          git add \
            examples/next/app/api/chat/route.ts \
            examples/next/util/chat-store.ts \
            examples/next/util/chat-store.test.ts \
            .github/workflows/fieldwork-format-resumable-stop.yml
          if git diff --cached --quiet; then
            echo 'No formatting changes required'
            exit 0
          fi
          git commit -m 'style: format resumable Stop candidate'
          git push origin HEAD:fieldwork/reset-resumable-stop-state
