name: Fieldwork explicit abort terminal repair

on:
  pull_request:
    branches:
      - fieldwork/explicit-abort-terminal-settlement
    paths:
      - .github/workflows/fieldwork-explicit-abort-terminal-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-explicit-abort-terminal-repair
  cancel-in-progress: true

jobs:
  repair-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/explicit-abort-terminal-settlement-repair
          fetch-depth: 0
          persist-credentials: false

      - name: Apply terminal-ordering repair
        shell: python
        run: |
          from pathlib import Path

          source = Path('packages/ai/src/generate-text/stream-text.ts')
          text = source.read_text(encoding='utf-8')

          abort_start = text.index('      abortPromise = (async () => {')
          notify_start = text.index('        await notify({', abort_start)
          notify_end = text.index('\n\n        if (!streamClosed)', notify_start)
          notify_block = text[notify_start:notify_end]
          if 'callbacks: [onAbort, telemetryDispatcher.onAbort]' not in notify_block:
              raise SystemExit('located the wrong notify block')
          text = text[:notify_start] + text[notify_end + 2:]

          cancel_line = '        void reader.cancel(reason).catch(() => {});\n'
          cancel_at = text.index(cancel_line, abort_start)
          deferred_notify = notify_block.replace('await notify(', 'void notify(', 1)
          insertion = (
              cancel_line
              + '\n'
              + '        // Terminal mechanics are complete before observability.\n'
              + deferred_notify
              + '\n'
          )
          text = text[:cancel_at] + insertion + text[cancel_at + len(cancel_line):]

          read_at = text.index(
              '          const { done, value } = await reader.read();', abort_start
          )
          post_read_at = text.index(
              '          if (abortSignal?.aborted) {', read_at
          )
          done_at = text.index('          if (done) {', post_read_at)
          new_post_read = (
              '          if (abortPromise != null || abortSignal?.aborted) {\n'
              '            await abort(controller);\n'
              '            return;\n'
              '          }\n\n'
          )
          text = text[:post_read_at] + new_post_read + text[done_at:]

          catch_at = text.index('        } catch (error) {', read_at)
          old_catch = '          if (isAbortError(error) && abortSignal?.aborted) {'
          catch_condition_at = text.index(old_catch, catch_at)
          new_catch = '          if (abortPromise != null || abortSignal?.aborted) {'
          text = (
              text[:catch_condition_at]
              + new_catch
              + text[catch_condition_at + len(old_catch):]
          )

          provider_result_at = text.index(
              '            stream: languageModelStream,', abort_start
          )
          first_chunk_timeout_at = text.index(
              '          startFirstChunkTimeout();', provider_result_at
          )
          pre_registration_cancel = (
              '          // Abort may win after the provider created its stream but before\n'
              '          // the stream is registered with the stitchable owner. Cancel the\n'
              '          // still-unlocked provider stream directly in that gap.\n'
              '          if (abortSignal?.aborted) {\n'
              '            cleanupStepTimeouts();\n'
              '            await languageModelStream.cancel(getAbortReason());\n'
              '            return;\n'
              '          }\n\n'
          )
          text = (
              text[:first_chunk_timeout_at]
              + pre_registration_cancel
              + text[first_chunk_timeout_at:]
          )

          unused_import = '  isAbortError,\n'
          if text.count(unused_import) != 1:
              raise SystemExit('isAbortError import anchor mismatch')
          text = text.replace(unused_import, '', 1)
          source.write_text(text, encoding='utf-8')

          tests = Path(
              'packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts'
          )
          test_text = tests.read_text(encoding='utf-8')
          if test_text.count('  it.fails(') != 2:
              raise SystemExit('expected exactly two retained race failures')
          tests.write_text(
              test_text.replace('  it.fails(', '  it('), encoding='utf-8'
          )

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the AI package dependency closure
        run: pnpm turbo build --filter=ai...

      - name: Run exact Node and Edge regressions
        run: |
          pnpm --dir packages/ai exec vitest \
            --config vitest.node.config.js --run \
            src/generate-text/stream-text-explicit-abort.test.ts \
            src/generate-text/stream-text-explicit-abort-races.test.ts
          pnpm --dir packages/ai exec vitest \
            --config vitest.edge.config.js --run \
            src/generate-text/stream-text-explicit-abort.test.ts \
            src/generate-text/stream-text-explicit-abort-races.test.ts
          pnpm --dir packages/ai type-check
          pnpm exec ultracite check \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts
          git diff --check

      - name: Record experiment receipt
        run: |
          printf '%s\n' \
            "base=$(git rev-parse HEAD)" \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)"
          git diff --stat
