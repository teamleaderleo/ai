name: Fieldwork explicit abort terminal repair

on:
  pull_request:
    branches:
      - fieldwork/explicit-abort-terminal-settlement
    paths:
      - .github/workflows/fieldwork-explicit-abort-terminal-repair.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-explicit-abort-terminal-repair
  cancel-in-progress: true

jobs:
  repair-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fieldwork/explicit-abort-terminal-settlement-repair
          fetch-depth: 0
          persist-credentials: false

      - name: Apply terminal-ordering repair
        shell: python
        run: |
          from pathlib import Path

          source = Path('packages/ai/src/generate-text/stream-text.ts')
          text = source.read_text(encoding='utf-8')

          notify_block = """        await notify({
            event: {
              callId,
              steps: recordedSteps,
              ...(reason !== undefined ? { reason } : {}),
            },
            callbacks: [onAbort, telemetryDispatcher.onAbort],
          });

          """
          if text.count(notify_block) != 1:
              raise SystemExit('abort notify block mismatch')
          text = text.replace(notify_block, '', 1)

          cancel_line = "        void reader.cancel(reason).catch(() => {});\n"
          notify_after = cancel_line + """

          // Terminal mechanics are complete. Observability callbacks may finish
          // later; notify() contains callback errors.
          void notify({
            event: {
              callId,
              steps: recordedSteps,
              ...(reason !== undefined ? { reason } : {}),
            },
            callbacks: [onAbort, telemetryDispatcher.onAbort],
          });
          """
          if text.count(cancel_line) != 1:
              raise SystemExit('abort reader-cancel line mismatch')
          text = text.replace(cancel_line, notify_after, 1)

          old_after_read = """          if (abortSignal?.aborted) {
            await abort(controller);
            return;
          }

          if (done) {"""
          new_after_read = """          if (abortPromise != null || abortSignal?.aborted) {
            await abort(controller);
            return;
          }

          if (done) {"""
          if text.count(old_after_read) != 1:
              raise SystemExit('post-read abort block mismatch')
          text = text.replace(old_after_read, new_after_read, 1)

          old_catch = '          if (isAbortError(error) && abortSignal?.aborted) {'
          new_catch = '          if (abortPromise != null || abortSignal?.aborted) {'
          if text.count(old_catch) != 1:
              raise SystemExit('abort catch mismatch')
          text = text.replace(old_catch, new_catch, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path(
              'packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts'
          )
          test_text = tests.read_text(encoding='utf-8')
          if test_text.count('  it.fails(') != 2:
              raise SystemExit('expected exactly two retained race failures')
          tests.write_text(
              test_text.replace('  it.fails(', '  it('), encoding='utf-8'
          )

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused Node and Edge regressions
        run: |
          pnpm --dir packages/ai test:node -- \
            src/generate-text/stream-text-explicit-abort.test.ts \
            src/generate-text/stream-text-explicit-abort-races.test.ts
          pnpm --dir packages/ai test:edge -- \
            src/generate-text/stream-text-explicit-abort.test.ts \
            src/generate-text/stream-text-explicit-abort-races.test.ts
          pnpm --dir packages/ai type-check
          pnpm exec ultracite check \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts
          git diff --check

      - name: Record experiment receipt
        run: |
          printf '%s\n' \
            "base=$(git rev-parse HEAD)" \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)"
          git diff --stat
