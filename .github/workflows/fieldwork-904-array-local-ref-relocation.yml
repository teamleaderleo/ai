name: Fieldwork 904 array local ref relocation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact characterization head
        run: |
          CHARACTERIZATION=ae351c3556c1d2e617f51db4da71947740836424
          git merge-base --is-ancestor "$CHARACTERIZATION" HEAD
          git diff --check "$CHARACTERIZATION"...HEAD
          git diff --name-only "$CHARACTERIZATION"...HEAD | sort > /tmp/actual
          printf '%s\n' .github/workflows/fieldwork-904-array-local-ref-relocation.yml | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Check focused test formatting
        run: pnpm exec oxfmt --check packages/ai/src/generate-text/fieldwork-array-local-ref-relocation.test.ts

      - name: Type-check AI package
        run: pnpm -C packages/ai type-check

      - name: Build AI package
        run: pnpm -C packages/ai build

      - name: Run focused array-ref controls
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/generate-text/fieldwork-array-local-ref-relocation.test.ts

      - name: Run existing output wrapper suites
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/generate-text/output.test.ts src/generate-object/output-strategy.test.ts
