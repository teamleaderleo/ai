name: Fieldwork Async Iterator Read Error

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 147e4066f69451e69aab26cbf47a7d273bbc6427

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AI dependency closure
        run: pnpm exec turbo build --filter=ai...

      - name: Run focused Node tests
        run: pnpm --dir packages/ai test:node -- src/util/async-iterable-stream-read-error.test.ts

      - name: Run focused Edge tests
        run: pnpm --dir packages/ai test:edge -- src/util/async-iterable-stream-read-error.test.ts

      - name: Type-check AI package
        run: pnpm --dir packages/ai type-check

      - name: Check formatting and lint
        run: pnpm exec ultracite check packages/ai/src/util/async-iterable-stream.ts packages/ai/src/util/async-iterable-stream-read-error.test.ts

      - name: Check candidate diff
        run: git diff --check 3bc0d4f40df7a77af4b181bc97dc1c54843545ab...147e4066f69451e69aab26cbf47a7d273bbc6427
