name: Fieldwork Claude unknown-native allow-edits

on:
  push:
    branches:
      - carrier/claude-unknown-native-allow-edits-run
  pull_request:
    branches:
      - research/claude-unknown-native-allow-edits-current

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source fence
        run: git diff --check
      - name: Package type check
        run: pnpm -C packages/harness-claude-code type-check
      - name: Focused unknown-native discriminator
        run: pnpm -C packages/harness-claude-code exec vitest --config vitest.node.config.js --run src/bridge/native-tool-kind-parity.fieldwork.test.ts
