name: Fieldwork Responses completion repair

on:
  push:
    branches:
      - repair/responses-action-completion-gating-20260812

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Apply completion gates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          def replace_exact(path: str, old: str, new: str, expected: int):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path}: expected {expected} replacements, found {count}'
                  )
              p.write_text(text.replace(old, new))

          open_responses = 'packages/open-responses/src/responses/open-responses-language-model.ts'
          replace_once(
              open_responses,
              """        case 'function_call': {\n          hasToolCalls = true;""",
              """        case 'function_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          hasToolCalls = true;""",
          )
          replace_once(
              open_responses,
              """              const input = toolCall?.arguments ?? chunk.item.arguments ?? '';\n\n              controller.enqueue({""",
              """              const input = toolCall?.arguments ?? chunk.item.arguments ?? '';\n\n              if (chunk.item.status !== 'completed') {\n                toolCallsByItemId.delete(chunk.item.id);\n                return;\n              }\n\n              controller.enqueue({""",
          )

          openai_api = 'packages/openai/src/responses/openai-responses-api.ts'
          replace_once(
              openai_api,
              """            z.object({\n              type: z.literal('function_call'),\n              call_id: z.string(),\n              name: z.string(),\n              arguments: z.string(),\n              id: z.string(),\n              namespace: z.string().nullish(),""",
              """            z.object({\n              type: z.literal('function_call'),\n              call_id: z.string(),\n              name: z.string(),\n              arguments: z.string(),\n              id: z.string(),\n              status: z.enum(['in_progress', 'completed', 'incomplete']),\n              namespace: z.string().nullish(),""",
          )
          replace_exact(
              openai_api,
              """          z.object({\n            type: z.literal('local_shell_call'),\n            id: z.string(),\n            call_id: z.string(),\n            action: z.object({""",
              """          z.object({\n            type: z.literal('local_shell_call'),\n            id: z.string(),\n            call_id: z.string(),\n            status: z.enum(['in_progress', 'completed', 'incomplete']),\n            action: z.object({""",
              2,
          )

          openai = 'packages/openai/src/responses/openai-responses-language-model.ts'
          replace_once(
              openai,
              """        case 'function_call': {\n          hasFunctionCall = true;""",
              """        case 'function_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          hasFunctionCall = true;""",
          )
          replace_once(
              openai,
              """        case 'local_shell_call': {\n          content.push({""",
              """        case 'local_shell_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              openai,
              """        case 'shell_call': {\n          content.push({""",
              """        case 'shell_call': {\n          if (!isShellProviderExecuted && part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              openai,
              """        case 'apply_patch_call': {\n          content.push({""",
              """        case 'apply_patch_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              openai,
              """        case 'tool_search_call': {\n          const toolCallId = part.call_id ?? part.id;\n          const isHosted = part.execution === 'server';\n\n          if (isHosted) {""",
              """        case 'tool_search_call': {\n          const toolCallId = part.call_id ?? part.id;\n          const isHosted = part.execution === 'server';\n\n          if (!isHosted && part.status !== 'completed') {\n            break;\n          }\n\n          if (isHosted) {""",
          )
          replace_once(
              openai,
              """              } else if (value.item.type === 'function_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n                hasFunctionCall = true;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'function_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
          )
          replace_once(
              openai,
              """                });\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName: value.item.name,""",
              """                });\n\n                if (value.item.status !== 'completed') {\n                  return;\n                }\n\n                hasFunctionCall = true;\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName: value.item.name,""",
          )
          replace_once(
              openai,
              """              } else if (value.item.type === 'local_shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'local_shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                if (value.item.status !== 'completed') {\n                  return;\n                }\n\n                controller.enqueue({""",
          )
          replace_once(
              openai,
              """              } else if (value.item.type === 'shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                if (\n                  !isShellProviderExecuted &&\n                  value.item.status !== 'completed'\n                ) {\n                  return;\n                }\n\n                controller.enqueue({""",
          )
          replace_once(
              openai,
              """                  if (isHosted) {\n                    hostedToolSearchCallIds.push(toolCallId);\n                  } else {\n                    controller.enqueue({\n                      type: 'tool-input-start',\n                      id: toolCallId,\n                      toolName: toolCall.toolName,\n                    });\n                  }\n\n                  controller.enqueue({\n                    type: 'tool-input-end',\n                    id: toolCallId,\n                  });\n\n                  controller.enqueue({""",
              """                  if (isHosted) {\n                    hostedToolSearchCallIds.push(toolCallId);\n                  } else {\n                    controller.enqueue({\n                      type: 'tool-input-start',\n                      id: toolCallId,\n                      toolName: toolCall.toolName,\n                    });\n                  }\n\n                  controller.enqueue({\n                    type: 'tool-input-end',\n                    id: toolCallId,\n                  });\n\n                  if (!isHosted && value.item.status !== 'completed') {\n                    ongoingToolCalls[value.output_index] = undefined;\n                    return;\n                  }\n\n                  controller.enqueue({""",
          )

          native_test = 'packages/openai/src/responses/openai-responses-completion-status.test.ts'
          replace_once(
              native_test,
              "import type { LanguageModelV4Prompt, LanguageModelV4Tool } from '@ai-sdk/provider';",
              "import type { LanguageModelV4Prompt } from '@ai-sdk/provider';",
          )
          replace_once(
              native_test,
              "type ApplyPatchStatus = 'completed' | 'in_progress';\n",
              "type ApplyPatchStatus = 'completed' | 'in_progress';\ntype LocalShellStatus = 'completed' | 'incomplete';\ntype ToolSearchStatus = 'completed' | 'incomplete';\n",
          )
          replace_once(
              native_test,
              "  | { kind: 'applyPatch'; status: ApplyPatchStatus };",
              "  | { kind: 'applyPatch'; status: ApplyPatchStatus }\n  | { kind: 'localShell'; status: LocalShellStatus }\n  | { kind: 'toolSearch'; status: ToolSearchStatus };",
          )
          replace_once(
              native_test,
              """    case 'applyPatch':\n      return {\n        id: 'ap_1',\n        type: 'apply_patch_call' as const,\n        call_id: 'call_1',\n        status: testCase.status,\n        operation: { type: 'delete_file' as const, path: 'fieldwork-sentinel.txt' },\n      };\n  }""",
              """    case 'applyPatch':\n      return {\n        id: 'ap_1',\n        type: 'apply_patch_call' as const,\n        call_id: 'call_1',\n        status: testCase.status,\n        operation: { type: 'delete_file' as const, path: 'fieldwork-sentinel.txt' },\n      };\n    case 'localShell':\n      return {\n        id: 'ls_1',\n        type: 'local_shell_call' as const,\n        call_id: 'call_1',\n        status: testCase.status,\n        action: {\n          type: 'exec' as const,\n          command: ['echo', 'fieldwork-sentinel'],\n          env: {},\n        },\n      };\n    case 'toolSearch':\n      return {\n        id: 'ts_1',\n        type: 'tool_search_call' as const,\n        execution: 'client' as const,\n        call_id: 'call_1',\n        status: testCase.status,\n        arguments: { goal: 'find a weather tool' },\n      };\n  }""",
          )
          replace_once(
              native_test,
              "function toolsFor(testCase: StatusCase): LanguageModelV4Tool[] | undefined {",
              "function toolsFor(testCase: StatusCase) {",
          )
          replace_once(
              native_test,
              """    case 'applyPatch':\n      return [openaiTools.applyPatch({})];\n  }""",
              """    case 'applyPatch':\n      return [openaiTools.applyPatch({})];\n    case 'localShell':\n      return [openaiTools.localShell({})];\n    case 'toolSearch':\n      return [\n        openaiTools.toolSearch({\n          execution: 'client',\n          description: 'Search available tools.',\n          parameters: {\n            type: 'object',\n            properties: { goal: { type: 'string' } },\n            required: ['goal'],\n            additionalProperties: false,\n          },\n        }),\n      ];\n  }""",
          )
          replace_once(
              native_test,
              """  { kind: 'applyPatch', status: 'completed' },\n  { kind: 'applyPatch', status: 'in_progress' },\n];""",
              """  { kind: 'applyPatch', status: 'completed' },\n  { kind: 'applyPatch', status: 'in_progress' },\n  { kind: 'localShell', status: 'completed' },\n  { kind: 'localShell', status: 'incomplete' },\n  { kind: 'toolSearch', status: 'completed' },\n  { kind: 'toolSearch', status: 'incomplete' },\n];""",
          )
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build affected packages and dependencies
        run: pnpm turbo build --filter=@ai-sdk/openai... --filter=@ai-sdk/open-responses...
      - name: Run Open Responses regression
        run: pnpm -C packages/open-responses exec vitest --config vitest.node.config.js --run src/responses/open-responses-completion-status.test.ts
      - name: Run native OpenAI regression
        run: pnpm -C packages/openai exec vitest --config vitest.node.config.js --run src/responses/openai-responses-completion-status.test.ts
      - name: Type-check affected packages
        run: |
          pnpm -C packages/open-responses type-check
          pnpm -C packages/openai type-check
      - name: Commit verified repair and remove carrier
        shell: bash
        run: |
          rm .github/workflows/fieldwork-responses-completion-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/open-responses/src/responses/open-responses-language-model.ts \
                  packages/openai/src/responses/openai-responses-api.ts \
                  packages/openai/src/responses/openai-responses-language-model.ts \
                  packages/openai/src/responses/openai-responses-completion-status.test.ts \
                  .github/workflows/fieldwork-responses-completion-repair.yml
          git commit -m "Gate incomplete Responses actions before execution"
          git push origin HEAD:repair/responses-action-completion-gating-20260812
