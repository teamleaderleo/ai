name: Fieldwork 546 chat callback ownership

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact characterization head
        run: |
          test "$(git rev-parse HEAD^)" = "a47f7dfc8d391fd5ea5e725efb8978d9365e60c2"
          git diff --check HEAD^...HEAD
          git diff --name-only HEAD^...HEAD | sort > /tmp/actual
          printf '%s\n' .github/workflows/fieldwork-546-chat-callback-ownership.yml | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Check focused test formatting
        run: pnpm exec oxfmt --check packages/ai/src/ui/fieldwork-chat-callback-ownership.test.ts

      - name: Type-check AI package
        run: pnpm -C packages/ai type-check

      - name: Build AI package
        run: pnpm -C packages/ai build

      - name: Run focused callback ownership controls
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/ui/fieldwork-chat-callback-ownership.test.ts

      - name: Run existing Chat Node suite
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/ui/chat.test.ts
