name: Fieldwork Claude new-tool permissions

on:
  pull_request:
    branches:
      - research/claude-code-new-tool-permissions-cfc587

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package type check
        run: pnpm -C packages/harness-claude-code type-check
      - name: Node characterization
        run: pnpm -C packages/harness-claude-code test:node -- new-tool-permissions.fieldwork.test.ts
