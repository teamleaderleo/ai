name: Fieldwork 866 Claude subagent terminal repair validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format focused test and print exact formatter diff
        run: |
          pnpm exec oxfmt packages/harness-claude-code/src/bridge/fieldwork-subagent-terminal-fallback.test.ts
          git diff -- packages/harness-claude-code/src/bridge/fieldwork-subagent-terminal-fallback.test.ts

      - name: Check production source formatting
        run: pnpm exec oxfmt --check packages/harness-claude-code/src/bridge/create-emit-stream-event.ts

      - name: Type-check Claude harness
        run: pnpm --filter @ai-sdk/harness-claude-code type-check

      - name: Build Claude harness
        run: pnpm --filter @ai-sdk/harness-claude-code build

      - name: Run focused Fieldwork terminal isolation controls
        run: pnpm --filter @ai-sdk/harness-claude-code test:node -- src/bridge/fieldwork-subagent-terminal-fallback.test.ts

      - name: Run Claude harness Node suite
        run: pnpm --filter @ai-sdk/harness-claude-code test:node
