name: fieldwork-resumable-stop-sequential

on:
  push:
    branches:
      - fieldwork/reset-resumable-stop-state
  pull_request:
    branches:
      - main
    paths:
      - examples/next/app/api/chat/route.ts
      - examples/next/util/chat-store.ts
      - examples/next/util/chat-store.test.ts
      - .github/workflows/fieldwork-resumable-stop-sequential.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-resumable-stop-sequential
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build AI package and workspace dependencies
        run: pnpm --filter ai... build
      - name: Execute sequential Stop-state cases
        run: pnpm exec vitest --run examples/next/util/chat-store.test.ts --environment node
      - name: Verify repository formatting for changed source
        run: pnpm exec ultracite check examples/next/app/api/chat/route.ts examples/next/util/chat-store.ts examples/next/util/chat-store.test.ts
