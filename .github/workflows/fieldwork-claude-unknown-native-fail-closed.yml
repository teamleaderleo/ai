name: Fieldwork Claude unknown-native fail-closed

on:
  push:
    branches:
      - carrier/claude-unknown-native-fail-closed-run
  pull_request:
    branches:
      - candidate/claude-unknown-native-fail-closed-current

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Source fence
        run: git diff --check
      - name: Package type check
        run: pnpm -C packages/harness-claude-code type-check
      - name: Build host and sandbox bridge entries
        run: pnpm -C packages/harness-claude-code build
      - name: Focused permission parity and unknown-native controls
        run: pnpm -C packages/harness-claude-code exec vitest --config vitest.node.config.js --run src/bridge/native-tool-kind-parity.fieldwork.test.ts
      - name: Full Node package tests
        run: pnpm -C packages/harness-claude-code test:node
