name: Fieldwork 902 abort EOF precedence validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format focused test in execution workspace
        run: |
          pnpm exec oxfmt packages/ai/src/generate-text/fieldwork-abort-eof-precedence.test.ts
          git diff -- packages/ai/src/generate-text/fieldwork-abort-eof-precedence.test.ts

      - name: Check focused test formatting
        run: pnpm exec oxfmt --check packages/ai/src/generate-text/fieldwork-abort-eof-precedence.test.ts

      - name: Type-check AI package
        run: pnpm -C packages/ai type-check

      - name: Build AI package
        run: pnpm -C packages/ai build

      - name: Run focused abort EOF controls
        run: pnpm -C packages/ai test:node -- src/generate-text/fieldwork-abort-eof-precedence.test.ts

      - name: Run existing streamText Node suite
        run: pnpm -C packages/ai test:node -- src/generate-text/stream-text.test.ts
