name: Fieldwork MCP retryable inbound SSE HTTP failures

on:
  pull_request:
    branches:
      - fieldwork/mcp-inbound-sse-lifecycle-repair
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: fieldwork-mcp-retryable-http
  cancel-in-progress: true

env:
  SOURCE_BASE: c8c3e306c256c178429eefcc4fdfff0a1477efe6

jobs:
  focused:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'repair/mcp-inbound-sse-retryable-http'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: repair/mcp-inbound-sse-retryable-http
          fetch-depth: 0

      - name: Verify exact base and carrier-only starting fence
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD "$SOURCE_BASE")" = "$SOURCE_BASE"
          git diff --name-only "$SOURCE_BASE"..HEAD | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/fieldwork/materialize-mcp-retryable-http.py
          .github/workflows/fieldwork-mcp-retryable-http.yml
          EOF
          diff -u /tmp/expected /tmp/actual

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize bounded source repair
        run: python3 .github/fieldwork/materialize-mcp-retryable-http.py

      - name: Format candidate files
        run: |
          pnpm exec prettier --write \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-http-retry.test.ts \
            .changeset/retry-inbound-sse-http.md

      - name: Build MCP package dependency closure
        run: pnpm turbo build --filter=@ai-sdk/mcp...

      - name: Run Node retry and lifecycle controls
        run: |
          pnpm --filter @ai-sdk/mcp exec vitest \
            --config vitest.node.config.js --run \
            src/tool/mcp-http-transport-inbound-sse-http-retry.test.ts \
            src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts \
            src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts

      - name: Run Edge retry and lifecycle controls
        run: |
          pnpm --filter @ai-sdk/mcp exec vitest \
            --config vitest.edge.config.js --run \
            src/tool/mcp-http-transport-inbound-sse-http-retry.test.ts \
            src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts \
            src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts

      - name: Run package type check
        run: pnpm --filter @ai-sdk/mcp type-check

      - name: Verify formatting and source fence
        run: |
          pnpm exec prettier --check \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-http-retry.test.ts \
            .changeset/retry-inbound-sse-http.md
          git diff --check

      - name: Publish clean three-file candidate
        run: |
          set -euo pipefail
          rm -f .github/fieldwork/materialize-mcp-retryable-http.py
          rm -f .github/workflows/fieldwork-mcp-retryable-http.yml
          git add -A
          git diff --cached --name-only "$SOURCE_BASE" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .changeset/retry-inbound-sse-http.md
          packages/mcp/src/tool/mcp-http-transport-inbound-sse-http-retry.test.ts
          packages/mcp/src/tool/mcp-http-transport.ts
          EOF
          diff -u /tmp/expected /tmp/actual
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(mcp): retry transient inbound SSE HTTP failures"
          git push origin HEAD:repair/mcp-inbound-sse-retryable-http
