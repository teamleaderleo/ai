name: Fieldwork 883 host tool serialization validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check focused test formatting
        run: pnpm exec oxfmt --check packages/harness/src/agent/internal/fieldwork-host-tool-serialization.test.ts

      - name: Type-check HarnessAgent package
        run: pnpm --filter @ai-sdk/harness type-check

      - name: Build HarnessAgent package
        run: pnpm --filter @ai-sdk/harness build

      - name: Run focused host-tool serialization control
        run: pnpm --filter @ai-sdk/harness test:node -- src/agent/internal/fieldwork-host-tool-serialization.test.ts

      - name: Run existing runPrompt Node suite
        run: pnpm --filter @ai-sdk/harness test:node -- src/agent/internal/run-prompt.test.ts
