name: Fieldwork 546 onError settlement repair proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify characterization ancestry and carrier-only delta
        run: |
          CHARACTERIZATION=a47f7dfc8d391fd5ea5e725efb8978d9365e60c2
          git merge-base --is-ancestor "$CHARACTERIZATION" HEAD
          git diff --check "$CHARACTERIZATION"...HEAD
          git diff --name-only "$CHARACTERIZATION"...HEAD | sort > /tmp/actual
          printf '%s\n' .github/workflows/fieldwork-546-onerror-settlement-repair-proof.yml | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Apply bounded repair and reverse focused assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          chat = Path('packages/ai/src/ui/chat.ts')
          text = chat.read_text()

          resume_old = """        if (this.onError && err instanceof Error) {\n          this.onError(err);\n        }\n        this.setStatus({ status: 'error', error: err as Error });\n        clearActiveResumeRequest();\n        return;\n"""
          resume_new = """        this.setStatus({ status: 'error', error: err as Error });\n        clearActiveResumeRequest();\n\n        if (this.onError && err instanceof Error) {\n          this.onError(err);\n        }\n        return;\n"""

          normal_old = """      if (this.onError && err instanceof Error) {\n        this.onError(err);\n      }\n\n      this.setStatus({ status: 'error', error: err as Error });\n"""
          normal_new = """      this.setStatus({ status: 'error', error: err as Error });\n\n      if (this.onError && err instanceof Error) {\n        this.onError(err);\n      }\n"""

          assert text.count(resume_old) == 1, text.count(resume_old)
          assert text.count(normal_old) == 1, text.count(normal_old)
          text = text.replace(resume_old, resume_new).replace(normal_old, normal_new)
          chat.write_text(text)

          test = Path('packages/ai/src/ui/fieldwork-chat-callback-ownership.test.ts')
          text = test.read_text()
          replacements = {
            "expect(chat.status).toBe('submitted');": "expect(chat.status).toBe('error');",
            "expect(chat.error).toBeUndefined();\n    expect((chat as any).activeResponse).toBeUndefined();": "expect(chat.error).toBe(transportError);\n    expect((chat as any).activeResponse).toBeUndefined();",
            "expect(chat.status).toBe('ready');": "expect(chat.status).toBe('error');",
            "expect(chat.error).toBeUndefined();\n    expect((chat as any).activeResumeRequest).toBeDefined();": "expect(chat.error).toBe(reconnectError);\n    expect((chat as any).activeResumeRequest).toBeUndefined();",
          }
          for old, new in replacements.items():
            assert text.count(old) == 1, (old, text.count(old))
            text = text.replace(old, new)
          test.write_text(text)
          PY

          git diff -- packages/ai/src/ui/chat.ts packages/ai/src/ui/fieldwork-chat-callback-ownership.test.ts

      - name: Check repaired source and focused test formatting
        run: pnpm exec oxfmt --check packages/ai/src/ui/chat.ts packages/ai/src/ui/fieldwork-chat-callback-ownership.test.ts

      - name: Type-check AI package
        run: pnpm -C packages/ai type-check

      - name: Build AI package
        run: pnpm -C packages/ai build

      - name: Run repaired callback ownership controls
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/ui/fieldwork-chat-callback-ownership.test.ts

      - name: Run existing Chat Node suite
        run: pnpm -C packages/ai exec vitest --config vitest.node.config.js --run src/ui/chat.test.ts
