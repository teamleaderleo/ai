name: Validate clean Responses completion restack

on:
  push:
    branches:
      - repair/responses-client-completion-clean-8e902831

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - name: Copy final regression files and changeset
        shell: bash
        run: |
          git fetch origin repair/responses-action-completion-gating-20260812
          git show origin/repair/responses-action-completion-gating-20260812:packages/open-responses/src/responses/open-responses-completion-status.test.ts > packages/open-responses/src/responses/open-responses-completion-status.test.ts
          git show origin/repair/responses-action-completion-gating-20260812:packages/openai/src/responses/openai-responses-completion-status.test.ts > packages/openai/src/responses/openai-responses-completion-status.test.ts
          git show origin/repair/responses-action-completion-gating-20260812:.changeset/quiet-responses-complete.md > .changeset/quiet-responses-complete.md
      - name: Apply completion gates to pinned source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              p.write_text(text.replace(old, new, 1))

          open_responses = 'packages/open-responses/src/responses/open-responses-language-model.ts'
          replace_once(
              open_responses,
              """        case 'function_call': {\n          hasToolCalls = true;""",
              """        case 'function_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          hasToolCalls = true;""",
          )
          replace_once(
              open_responses,
              """              const input = toolCall?.arguments ?? chunk.item.arguments ?? '';\n\n              controller.enqueue({""",
              """              const input = toolCall?.arguments ?? chunk.item.arguments ?? '';\n\n              if (chunk.item.status !== 'completed') {\n                toolCallsByItemId.delete(chunk.item.id);\n                return;\n              }\n\n              controller.enqueue({""",
          )

          api = 'packages/openai/src/responses/openai-responses-api.ts'
          replace_once(
              api,
              """          z.object({\n            type: z.literal('custom_tool_call'),\n            id: z.string(),\n            call_id: z.string(),\n            name: z.string(),\n            input: z.string(),\n            status: z.literal('completed'),\n          }),""",
              """          z.object({\n            type: z.literal('custom_tool_call'),\n            id: z.string(),\n            call_id: z.string(),\n            name: z.string(),\n            input: z.string(),\n            status: z.enum(['in_progress', 'completed', 'incomplete']),\n          }),""",
          )
          replace_once(
              api,
              """          z.object({\n            type: z.literal('local_shell_call'),\n            id: z.string(),\n            call_id: z.string(),\n            action: z.object({""",
              """          z.object({\n            type: z.literal('local_shell_call'),\n            id: z.string(),\n            call_id: z.string(),\n            status: z.enum(['in_progress', 'completed', 'incomplete']),\n            action: z.object({""",
          )
          replace_once(
              api,
              """            z.object({\n              type: z.literal('local_shell_call'),\n              id: z.string(),\n              call_id: z.string(),\n              action: z.object({""",
              """            z.object({\n              type: z.literal('local_shell_call'),\n              id: z.string(),\n              call_id: z.string(),\n              status: z.enum(['in_progress', 'completed', 'incomplete']),\n              action: z.object({""",
          )
          replace_once(
              api,
              """            z.object({\n              type: z.literal('function_call'),\n              call_id: z.string(),\n              name: z.string(),\n              arguments: z.string(),\n              id: z.string(),\n              namespace: z.string().nullish(),""",
              """            z.object({\n              type: z.literal('function_call'),\n              call_id: z.string(),\n              name: z.string(),\n              arguments: z.string(),\n              id: z.string(),\n              status: z.enum(['in_progress', 'completed', 'incomplete']),\n              namespace: z.string().nullish(),""",
          )
          replace_once(
              api,
              """            z.object({\n              type: z.literal('custom_tool_call'),\n              call_id: z.string(),\n              name: z.string(),\n              input: z.string(),\n              id: z.string(),\n            }),""",
              """            z.object({\n              type: z.literal('custom_tool_call'),\n              call_id: z.string(),\n              name: z.string(),\n              input: z.string(),\n              id: z.string(),\n              status: z.enum(['in_progress', 'completed', 'incomplete']),\n            }),""",
          )

          model = 'packages/openai/src/responses/openai-responses-language-model.ts'
          replace_once(
              model,
              """        case 'tool_search_call': {\n          const toolCallId = part.call_id ?? part.id;\n          const isHosted = part.execution === 'server';\n\n          if (isHosted) {""",
              """        case 'tool_search_call': {\n          const toolCallId = part.call_id ?? part.id;\n          const isHosted = part.execution === 'server';\n\n          if (!isHosted && part.status !== 'completed') {\n            break;\n          }\n\n          if (isHosted) {""",
          )
          replace_once(
              model,
              """        case 'local_shell_call': {\n          content.push({""",
              """        case 'local_shell_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              model,
              """        case 'shell_call': {\n          content.push({""",
              """        case 'shell_call': {\n          if (!isShellProviderExecuted && part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              model,
              """        case 'function_call': {\n          hasFunctionCall = true;""",
              """        case 'function_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          hasFunctionCall = true;""",
          )
          replace_once(
              model,
              """        case 'custom_tool_call': {\n          hasFunctionCall = true;""",
              """        case 'custom_tool_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          hasFunctionCall = true;""",
          )
          replace_once(
              model,
              """        case 'apply_patch_call': {\n          content.push({""",
              """        case 'apply_patch_call': {\n          if (part.status !== 'completed') {\n            break;\n          }\n\n          content.push({""",
          )
          replace_once(
              model,
              """              } else if (value.item.type === 'function_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n                hasFunctionCall = true;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'function_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
          )
          replace_once(
              model,
              """                });\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName: value.item.name,""",
              """                });\n\n                if (value.item.status !== 'completed') {\n                  return;\n                }\n\n                hasFunctionCall = true;\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName: value.item.name,""",
          )
          replace_once(
              model,
              """              } else if (value.item.type === 'custom_tool_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n                hasFunctionCall = true;\n                const toolName = toolNameMapping.toCustomToolName(""",
              """              } else if (value.item.type === 'custom_tool_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n                const toolName = toolNameMapping.toCustomToolName(""",
          )
          replace_once(
              model,
              """                const toolName = toolNameMapping.toCustomToolName(\n                  value.item.name,\n                );\n\n                controller.enqueue({\n                  type: 'tool-input-end',\n                  id: value.item.call_id,\n                });\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName,""",
              """                const toolName = toolNameMapping.toCustomToolName(\n                  value.item.name,\n                );\n\n                controller.enqueue({\n                  type: 'tool-input-end',\n                  id: value.item.call_id,\n                });\n\n                if (value.item.status !== 'completed') {\n                  return;\n                }\n\n                hasFunctionCall = true;\n\n                controller.enqueue({\n                  type: 'tool-call',\n                  toolCallId: value.item.call_id,\n                  toolName,""",
          )
          replace_once(
              model,
              """                  controller.enqueue({\n                    type: 'tool-input-end',\n                    id: toolCallId,\n                  });\n\n                  controller.enqueue({\n                    type: 'tool-call',\n                    toolCallId,\n                    toolName: toolCall.toolName,""",
              """                  controller.enqueue({\n                    type: 'tool-input-end',\n                    id: toolCallId,\n                  });\n\n                  if (!isHosted && value.item.status !== 'completed') {\n                    ongoingToolCalls[value.output_index] = undefined;\n                    return;\n                  }\n\n                  controller.enqueue({\n                    type: 'tool-call',\n                    toolCallId,\n                    toolName: toolCall.toolName,""",
          )
          replace_once(
              model,
              """              } else if (value.item.type === 'local_shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'local_shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                if (value.item.status !== 'completed') {\n                  return;\n                }\n\n                controller.enqueue({""",
          )
          replace_once(
              model,
              """              } else if (value.item.type === 'shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                controller.enqueue({""",
              """              } else if (value.item.type === 'shell_call') {\n                ongoingToolCalls[value.output_index] = undefined;\n\n                if (\n                  !isShellProviderExecuted &&\n                  value.item.status !== 'completed'\n                ) {\n                  return;\n                }\n\n                controller.enqueue({""",
          )
          PY
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build affected packages and dependencies
        run: pnpm turbo build --filter=@ai-sdk/openai... --filter=@ai-sdk/open-responses...
      - name: Run Open Responses regressions
        run: pnpm -C packages/open-responses exec vitest --config vitest.node.config.js --run src/responses/open-responses-completion-status.test.ts
      - name: Run native OpenAI regressions
        run: pnpm -C packages/openai exec vitest --config vitest.node.config.js --run src/responses/openai-responses-completion-status.test.ts
      - name: Type-check affected packages
        run: |
          pnpm -C packages/open-responses type-check
          pnpm -C packages/openai type-check
      - name: Commit validated clean restack and remove carrier
        shell: bash
        run: |
          rm .github/workflows/fieldwork-responses-clean-restack.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/open-responses/src/responses/open-responses-language-model.ts \
                  packages/open-responses/src/responses/open-responses-completion-status.test.ts \
                  packages/openai/src/responses/openai-responses-api.ts \
                  packages/openai/src/responses/openai-responses-language-model.ts \
                  packages/openai/src/responses/openai-responses-completion-status.test.ts \
                  .changeset/quiet-responses-complete.md \
                  .github/workflows/fieldwork-responses-clean-restack.yml
          git commit --no-verify -m "fix: gate incomplete Responses client actions"
          git push origin HEAD:repair/responses-client-completion-clean-8e902831
