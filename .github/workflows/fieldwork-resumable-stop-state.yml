name: Fieldwork resumable Stop state

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fieldwork-resumable-stop-state.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-resumable-stop-state
  cancel-in-progress: true

jobs:
  focused-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          ref: 656b6d6ec02b2db5077e49d41986068c387cb81f
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create focused virtual AI module
        run: |
          cat > .fieldwork-ai-stub.ts <<'EOF'
          export const generateId = () => 'generated-chat-id';
          EOF
          cat > .fieldwork-resumable-stop-vitest.config.ts <<'EOF'
          import path from 'node:path';
          import { fileURLToPath } from 'node:url';
          import { defineConfig } from 'vitest/config';

          const root = path.dirname(fileURLToPath(import.meta.url));

          export default defineConfig({
            resolve: {
              alias: {
                ai: path.join(root, '.fieldwork-ai-stub.ts'),
              },
            },
          });
          EOF

      - name: Run focused file-store regression
        run: >-
          pnpm exec vitest --run
          --config .fieldwork-resumable-stop-vitest.config.ts
          examples/next/util/chat-store.test.ts
          --environment node

      - name: Check changed files
        run: >-
          pnpm exec ultracite check
          examples/next/app/api/chat/route.ts
          examples/next/util/chat-store.ts
          examples/next/util/chat-store.test.ts

      - name: Record exact receipt
        run: |
          printf '%s\n' \
            'candidate=resumable Stop sequential mitigation' \
            'sha=656b6d6ec02b2db5077e49d41986068c387cb81f' \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)" \
            'ordinary_case=stale Stop cleared before next ordered run' \
            'expected_failure=delayed Stop still targets chat rather than run'
