name: Fieldwork explicit abort rejection ownership

on:
  pull_request:
    branches:
      - fieldwork/explicit-abort-terminal-settlement-repair
    paths:
      - .github/workflows/fieldwork-explicit-abort-rejection-ownership.yml
      - .github/fieldwork/materialize-explicit-abort-rejection-ownership.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fieldwork-explicit-abort-rejection-ownership
  cancel-in-progress: true

env:
  SOURCE_HEAD: 1413abfbbc6fc1ea0683d30613052e26c2b1ce51
  SOURCE_BRANCH: fieldwork/explicit-abort-terminal-settlement-repair
  MATERIALIZER_REF: origin/execution/explicit-abort-rejection-ownership

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        node: [22, 26]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Materialize observer-before-reject repair
        run: |
          git show \
            "$MATERIALIZER_REF:.github/fieldwork/materialize-explicit-abort-rejection-ownership.py" \
            | python3 -

      - name: Format candidate files
        run: |
          pnpm exec prettier --write \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts

      - name: Build AI package dependency closure
        run: pnpm turbo build --filter=ai...

      - name: Run Node explicit-abort controls
        run: |
          pnpm --filter ai exec vitest \
            --config vitest.node.config.js --run \
            src/generate-text/stream-text-explicit-abort-races.test.ts \
            src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts

      - name: Run Edge explicit-abort controls
        if: matrix.node == 22
        run: |
          pnpm --filter ai exec vitest \
            --config vitest.edge.config.js --run \
            src/generate-text/stream-text-explicit-abort-races.test.ts

      - name: Run package type check
        if: matrix.node == 22
        run: pnpm --filter ai type-check

      - name: Verify formatting and three-file fence
        run: |
          pnpm exec prettier --check \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts
          git diff --check
          mapfile -t changed < <(git status --short | sed 's/^...//' | sort)
          printf 'changed files:\n%s\n' "${changed[*]}"
          expected=(
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts
            packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts
            packages/ai/src/generate-text/stream-text.ts
          )
          test "${changed[*]}" = "${expected[*]}"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

  publish:
    needs: focused
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out canonical source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Verify unchanged canonical source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize and format validated repair
        run: |
          git show \
            "$MATERIALIZER_REF:.github/fieldwork/materialize-explicit-abort-rejection-ownership.py" \
            | python3 -
          pnpm exec prettier --write \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts
          git diff --check

      - name: Publish exact three-file candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            packages/ai/src/generate-text/stream-text.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts \
            packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts packages/ai/src/generate-text/stream-text-explicit-abort-unhandled-rejections.test.ts packages/ai/src/generate-text/stream-text.ts "
          git commit -m "fix(ai): observe abort result rejections before settlement"
          git push origin "HEAD:$SOURCE_BRANCH"
