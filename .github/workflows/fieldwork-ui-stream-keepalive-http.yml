name: Fieldwork UI stream keep-alive HTTP

on:
  pull_request:
    branches:
      - main
    paths:
      - .fieldwork/ui-stream-keepalive-http-probe.mjs
      - .github/workflows/fieldwork-ui-stream-keepalive-http.yml

permissions:
  contents: read

concurrency:
  group: fieldwork-ui-stream-keepalive-http
  cancel-in-progress: true

jobs:
  node-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out execution carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: carrier

      - name: Check out exact candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 7c8b95b12e7a47e0f614ff949b645e546488eea7
          path: candidate

      - name: Preserve canonical SSE completion control
        shell: python
        run: |
          from pathlib import Path

          probe = Path('carrier/.fieldwork/ui-stream-keepalive-http-probe.mjs')
          text = probe.read_text(encoding='utf-8')
          old = "    assert.equal(completed.body, ': stream-open\\n\\n');\n"
          new = (
              "    assert(completed.body.startsWith(': stream-open\\n\\n'));\n"
              "    assert(completed.body.includes('data: [DONE]\\n\\n'));\n"
          )
          if text.count(old) != 1:
              raise SystemExit('completion assertion anchor mismatch')
          probe.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.33.4

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml

      - name: Install candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Run real HTTP and proxy liveness probe
        working-directory: candidate
        env:
          EXPECTED_CANDIDATE_HEAD: 7c8b95b12e7a47e0f614ff949b645e546488eea7
        run: >-
          ./packages/ai/node_modules/.bin/tsx
          ../carrier/.fieldwork/ui-stream-keepalive-http-probe.mjs

      - name: Record exact receipt
        run: |
          printf '%s\n' \
            "candidate=$(git -C candidate rev-parse HEAD)" \
            "carrier=$(git -C carrier rev-parse HEAD)" \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)"
