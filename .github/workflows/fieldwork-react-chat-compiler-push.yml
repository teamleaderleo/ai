name: Fieldwork React chat compiler push verification

on:
  push:
    branches:
      - exec/react-chat-bounded-snapshot-push-7d40faf

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  react-chat-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install repository dependencies
        run: pnpm install --frozen-lockfile

      - name: Build React dependency closure
        run: pnpm --filter @ai-sdk/react... build

      - name: Type-check React package
        run: pnpm --filter @ai-sdk/react type-check

      - name: Run bounded publication target test
        run: pnpm --filter @ai-sdk/react exec vitest --config vitest.config.js --run src/chat.react.test.ts

      - name: Install compiler dependencies for this carrier only
        run: pnpm add -Dw --lockfile=false babel-plugin-react-compiler@latest react-compiler-runtime@latest

      - name: Record compiler dependency versions
        run: pnpm list -w babel-plugin-react-compiler react-compiler-runtime

      - name: Run React Compiler discriminator
        run: pnpm --filter @ai-sdk/react exec vitest --config vitest.react-compiler.config.js --run

      - name: Publish execution receipt to canonical PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          versions="$(pnpm list -w babel-plugin-react-compiler react-compiler-runtime 2>&1 || true)"
          body=$(cat <<EOF
          FIELDWORK EXECUTION RECEIPT
          Campaign: teamleaderleo/fieldwork#851
          Canonical source: #91@879d691d0bb81455cdbc3edb4fffdf9906d28b5a
          Execution head: ${GITHUB_SHA}
          Result: ${JOB_STATUS}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Compiler dependencies:
          \\`\\`\\`
          ${versions}
          \\`\\`\\`

          Evidence scope: focused owned-fork execution only. See the workflow steps for the React dependency build, package type-check, bounded publication target test, and compiler-sensitive discriminator.
          EOF
          )
          gh pr comment 91 --body "$body"
