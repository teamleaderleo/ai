name: Fieldwork React chat compiler push verification

on:
  push:
    branches:
      - exec/react-chat-bounded-snapshot-push-7d40faf

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  react-chat-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install repository dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build React dependency closure
        id: build
        run: pnpm --filter @ai-sdk/react... build

      - name: Type-check React package
        id: typecheck
        run: pnpm --filter @ai-sdk/react type-check

      - name: Run bounded publication target test
        id: target_test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @ai-sdk/react exec vitest --config vitest.config.js --run src/chat.react.test.ts 2>&1 | tee /tmp/fieldwork-target-test.log

      - name: Characterize first assistant publication aliasing
        id: alias_test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @ai-sdk/react exec vitest --config vitest.config.js --run src/chat.first-publication-alias.fieldwork.test.ts 2>&1 | tee /tmp/fieldwork-alias-test.log

      - name: Install compiler dependencies for this carrier only
        id: compiler_install
        run: pnpm add -Dw --lockfile=false babel-plugin-react-compiler@latest react-compiler-runtime@latest

      - name: Record compiler dependency versions
        id: versions
        shell: bash
        run: pnpm list -w babel-plugin-react-compiler react-compiler-runtime 2>&1 | tee /tmp/fieldwork-compiler-versions.log

      - name: Run React Compiler discriminator
        id: compiler_test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @ai-sdk/react exec vitest --config vitest.react-compiler.config.js --run 2>&1 | tee /tmp/fieldwork-compiler-test.log

      - name: Publish execution receipt to canonical PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TARGET_TEST_OUTCOME: ${{ steps.target_test.outcome }}
          ALIAS_TEST_OUTCOME: ${{ steps.alias_test.outcome }}
          COMPILER_INSTALL_OUTCOME: ${{ steps.compiler_install.outcome }}
          VERSIONS_OUTCOME: ${{ steps.versions.outcome }}
          COMPILER_TEST_OUTCOME: ${{ steps.compiler_test.outcome }}
        run: |
          versions="$(cat /tmp/fieldwork-compiler-versions.log 2>/dev/null || true)"
          target_tail="$(tail -n 40 /tmp/fieldwork-target-test.log 2>/dev/null || true)"
          alias_tail="$(tail -n 40 /tmp/fieldwork-alias-test.log 2>/dev/null || true)"
          compiler_tail="$(tail -n 60 /tmp/fieldwork-compiler-test.log 2>/dev/null || true)"
          body=$(cat <<EOF
          FIELDWORK EXECUTION RECEIPT
          Campaign: teamleaderleo/fieldwork#851
          Adjacent lead: teamleaderleo/fieldwork#852
          Canonical source: #91@879d691d0bb81455cdbc3edb4fffdf9906d28b5a
          Execution head: ${GITHUB_SHA}
          Result: ${JOB_STATUS}
          Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Step outcomes:
          - install: ${INSTALL_OUTCOME}
          - build: ${BUILD_OUTCOME}
          - type-check: ${TYPECHECK_OUTCOME}
          - bounded target test: ${TARGET_TEST_OUTCOME}
          - first-publication alias characterization: ${ALIAS_TEST_OUTCOME}
          - compiler install: ${COMPILER_INSTALL_OUTCOME}
          - compiler versions: ${VERSIONS_OUTCOME}
          - compiler discriminator: ${COMPILER_TEST_OUTCOME}

          Compiler dependencies:
          \\`\\`\\`
          ${versions}
          \\`\\`\\`

          Bounded target-test tail:
          \\`\\`\\`
          ${target_tail}
          \\`\\`\\`

          First-publication alias-test tail:
          \\`\\`\\`
          ${alias_tail}
          \\`\\`\\`

          Compiler-test tail:
          \\`\\`\\`
          ${compiler_tail}
          \\`\\`\\`

          Evidence scope: focused owned-fork execution only. The canonical #851 source remains #91; this carrier also contains one temporary characterization for adjacent lead #852.
          EOF
          )
          gh pr comment 91 --body "$body"
