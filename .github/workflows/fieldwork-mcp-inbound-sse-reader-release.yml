name: Fieldwork MCP inbound SSE reader release

on:
  pull_request:
    branches:
      - fieldwork/mcp-inbound-sse-lifecycle-repair
    paths:
      - .github/workflows/fieldwork-mcp-inbound-sse-reader-release.yml
      - .github/fieldwork/materialize-mcp-reader-release.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-mcp-inbound-sse-reader-release
  cancel-in-progress: true

env:
  SOURCE_HEAD: c26e29ff39b414e368526afa9eb4cc3d1230a84a

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"

      - name: Materialize bounded reader-release repair
        run: python3 .github/fieldwork/materialize-mcp-reader-release.py

      - name: Format candidate files
        run: |
          pnpm exec prettier --write \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts

      - name: Run focused and adjacent Node controls
        run: |
          pnpm --filter @ai-sdk/mcp exec vitest \
            --config vitest.node.config.js --run \
            src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts \
            src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts

      - name: Run focused and adjacent Edge controls
        run: |
          pnpm --filter @ai-sdk/mcp exec vitest \
            --config vitest.edge.config.js --run \
            src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts \
            src/tool/mcp-http-transport-inbound-sse-lifecycle.test.ts

      - name: Run package type check and build
        run: |
          pnpm --filter @ai-sdk/mcp type-check
          pnpm --filter @ai-sdk/mcp build

      - name: Verify formatting and two-file fence
        run: |
          pnpm exec prettier --check \
            packages/mcp/src/tool/mcp-http-transport.ts \
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            packages/mcp/src/tool/mcp-http-transport-inbound-sse-reader-release.test.ts
            packages/mcp/src/tool/mcp-http-transport.ts
          )
          test "${changed[*]}" = "${expected[*]}"
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
