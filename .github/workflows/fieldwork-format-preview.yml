name: Fieldwork format preview

on:
  pull_request:
    paths:
      - packages/ai/src/generate-text/stream-text-explicit-abort.test.ts
      - packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts
      - .github/workflows/fieldwork-format-preview.yml

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Print exact repository formatter output
        run: |
          pnpm run fix
          echo 'BEGIN_ABORT_TEST_BASE64'
          base64 -w0 packages/ai/src/generate-text/stream-text-explicit-abort.test.ts
          echo
          echo 'END_ABORT_TEST_BASE64'
          echo 'BEGIN_ABORT_RACES_BASE64'
          base64 -w0 packages/ai/src/generate-text/stream-text-explicit-abort-races.test.ts
          echo
          echo 'END_ABORT_RACES_BASE64'
