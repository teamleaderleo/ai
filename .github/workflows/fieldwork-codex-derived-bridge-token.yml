name: Fieldwork Codex derived bridge token

on:
  pull_request:
    branches:
      - candidate/codex-derived-bridge-token-current

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/codex-derived-bridge-token-current
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Capture source generation
        run: |
          source_head="$(git rev-parse HEAD)"
          echo "SOURCE_HEAD=$source_head" >> "$GITHUB_ENV"
          echo "source head: $source_head"
      - run: pnpm install --frozen-lockfile
      - name: Materialize adapter-side reconstruction prototype
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('packages/harness-codex/src/codex-harness.ts')
          text = path.read_text()

          if 'const resolveDerivedBridgeToken = (): string | undefined =>' not in text:
              def replace_once(old: str, new: str) -> None:
                  global text
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(
                          f'expected one source match, found {count}: {old[:80]!r}'
                      )
                  text = text.replace(old, new, 1)

              replace_once(
                  '  token: z.string(),\n  lastSeenEventId: z.number(),',
                  '  token: z.string().optional(),\n  lastSeenEventId: z.number(),',
              )
              replace_once(
                  '      const timeoutMs = settings.startupTimeoutMs ?? 120_000;\n',
                  "      const timeoutMs = settings.startupTimeoutMs ?? 120_000;\n"
                  "      let derivedBridgeToken: string | undefined;\n"
                  "      const resolveDerivedBridgeToken = (): string | undefined => {\n"
                  "        if (settings.mintBridgeToken == null) return undefined;\n"
                  "        if (derivedBridgeToken === undefined) {\n"
                  "          derivedBridgeToken = settings.mintBridgeToken(sandboxId);\n"
                  "        }\n"
                  "        return derivedBridgeToken;\n"
                  "      };\n",
              )
              replace_once(
                  '      if (coords) {\n        try {\n',
                  "      const attachToken =\n"
                  "        coords == null\n"
                  "          ? undefined\n"
                  "          : (coords.token ?? resolveDerivedBridgeToken());\n"
                  "      if (coords != null && attachToken == null) {\n"
                  "        throw new HarnessCapabilityUnsupportedError({\n"
                  "          harnessId: 'codex',\n"
                  "          message:\n"
                  "            'Codex live bridge resume state is missing its authentication token and deterministic minting is not configured.',\n"
                  "        });\n"
                  "      }\n\n"
                  "      if (coords) {\n"
                  "        try {\n",
              )
              replace_once(
                  '${encodeURIComponent(coords.token)}`;',
                  '${encodeURIComponent(attachToken!)}`;',
              )
              replace_once(
                  '            bridgeToken: coords.token,',
                  '            bridgeToken: attachToken!,',
              )
              replace_once(
                  "      const token =\n"
                  "        settings.mintBridgeToken == null\n"
                  "          ? randomBytes(32).toString('hex')\n"
                  "          : settings.mintBridgeToken(sandboxId);",
                  "      const token =\n"
                  "        settings.mintBridgeToken == null\n"
                  "          ? randomBytes(32).toString('hex')\n"
                  "          : resolveDerivedBridgeToken()!;",
              )

              path.write_text(text)
          PY
      - name: Fence and publish candidate generation
        run: |
          if git diff --quiet; then
            echo 'adapter prototype already materialized'
          else
            actual="$(git diff --name-only)"
            echo "changed files: $actual"
            test "$actual" = 'packages/harness-codex/src/codex-harness.ts'
            git diff --check

            git fetch origin candidate/codex-derived-bridge-token-current
            remote_head="$(git rev-parse origin/candidate/codex-derived-bridge-token-current)"
            echo "remote source head before publication: $remote_head"
            test "$remote_head" = "$SOURCE_HEAD"

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add packages/harness-codex/src/codex-harness.ts
            git commit -m 'Prototype deterministic bridge-token reconstruction'
            git push origin HEAD:candidate/codex-derived-bridge-token-current
          fi

          final_head="$(git rev-parse HEAD)"
          echo "FINAL_SOURCE_HEAD=$final_head" >> "$GITHUB_ENV"
          echo "final source head: $final_head"
      - name: Codex harness type check
        run: pnpm -C packages/harness-codex type-check
      - name: Codex harness Node tests
        run: pnpm -C packages/harness-codex test:node
      - name: Final source fence
        run: |
          echo "validated source head: $FINAL_SOURCE_HEAD"
          test "$(git rev-parse HEAD)" = "$FINAL_SOURCE_HEAD"
          git diff --check
          test -z "$(git status --porcelain)"
