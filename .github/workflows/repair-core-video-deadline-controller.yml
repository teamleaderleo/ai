name: Repair core video deadline controller compatibility

on:
  pull_request:
    branches:
      - research/base-main-06fd
    types:
      - synchronize

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.actor == 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'fix/core-video-operation-deadline'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-video-operation-deadline
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Preserve optional AbortController support
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('packages/ai/src/generate-video/generate-video.ts')
          source = path.read_text()
          start = source.index('function createOperationDeadline({')
          end = source.index('async function waitForWebhook', start)
          helper = r'''function createOperationDeadline({
            timeoutMs,
            abortSignal,
            startTime,
          }: {
            timeoutMs: number;
            abortSignal?: AbortSignal;
            startTime: number;
          }) {
            const timeoutError = new Error(
              `Video generation timed out after ${timeoutMs}ms.`,
            );
            const deadlineAt = startTime + timeoutMs;
            const deadlineController =
              typeof globalThis.AbortController === 'function'
                ? new globalThis.AbortController()
                : undefined;
            const signal =
              deadlineController == null
                ? abortSignal
                : mergeAbortSignals(abortSignal, deadlineController.signal);
            let expired = false;
            let timeoutId: ReturnType<typeof setTimeout> | undefined;

            const abortDeadline = (): void => {
              expired = true;
              if (deadlineController?.signal.aborted === false) {
                deadlineController.abort(timeoutError);
              }
            };

            const throwTimeout = (): never => {
              abortDeadline();
              throw timeoutError;
            };

            const assertActive = (): void => {
              if (expired || Date.now() >= deadlineAt) {
                throwTimeout();
              }
            };

            const timeoutPromise: Promise<never> = Number.isFinite(timeoutMs)
              ? new Promise<never>((_, reject) => {
                  timeoutId = setTimeout(() => {
                    abortDeadline();
                    reject(timeoutError);
                  }, Math.max(0, timeoutMs));
                })
              : new Promise<never>(() => {});

            // Every race adopts the operation and timeout promises. This extra
            // handler also covers a zero-duration deadline before the first race.
            void timeoutPromise.catch(() => {});

            return {
              signal,
              assertActive,
              async race<T>(operation: PromiseLike<T>): Promise<T> {
                try {
                  const result = await Promise.race([
                    Promise.resolve(operation),
                    timeoutPromise,
                  ]);
                  assertActive();
                  return result;
                } catch (error) {
                  if (expired || Date.now() >= deadlineAt) {
                    throwTimeout();
                  }
                  throw error;
                }
              },
              dispose(): void {
                if (timeoutId != null) {
                  clearTimeout(timeoutId);
                }
              },
            };
          }

          '''
          path.write_text(source[:start] + helper + source[end:])
          PY
      - name: Format candidate
        run: pnpm exec oxfmt packages/ai/src/generate-video/generate-video.ts
      - name: Build AI package
        run: pnpm -C packages/ai build
      - name: Run deadline and existing generate-video tests
        run: |
          pnpm -C packages/ai exec vitest --config vitest.node.config.js --run \
            src/generate-video/core-video-operation-deadline.test.ts \
            src/generate-video/generate-video.test.ts
      - name: Publish compatible clean head
        run: |
          rm .github/workflows/repair-core-video-deadline-controller.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/ai/src/generate-video/generate-video.ts \
            .github/workflows/repair-core-video-deadline-controller.yml
          git commit -m "fix(ai): preserve optional abort controller support"
          git push origin HEAD:fix/core-video-operation-deadline