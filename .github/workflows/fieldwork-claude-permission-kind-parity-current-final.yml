name: Fieldwork Claude permission parity current final

on:
  pull_request:
    branches:
      - candidate/claude-permission-kind-parity-current-8e90

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exact current-base five-file fence
        shell: bash
        run: |
          set -euo pipefail
          base=8e9028317de6a72973971356283271aff44bba74
          git fetch --no-tags --depth=1 origin "$base"
          git diff --check "$base" HEAD
          actual="$(git diff --name-only "$base" HEAD | grep -v '^.github/workflows/fieldwork-claude-permission-kind-parity-current-final.yml$' | sort)"
          expected="$(printf '%s\n' \
            '.changeset/claude-permission-kind-parity.md' \
            'packages/harness-claude-code/src/bridge/index.ts' \
            'packages/harness-claude-code/src/bridge/native-tool-kind-parity.test.ts' \
            'packages/harness-claude-code/src/claude-code-harness.ts' \
            'packages/harness-claude-code/src/native-tool-kinds.ts' | sort)"
          test "$actual" = "$expected"
      - name: Package type check
        run: pnpm -C packages/harness-claude-code type-check
      - name: Build host and sandbox bridge entries
        run: pnpm -C packages/harness-claude-code build
      - name: Verify shared map is bundled into sandbox bridge
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Agent' packages/harness-claude-code/dist/bridge/index.mjs
          grep -Fq 'PowerShell' packages/harness-claude-code/dist/bridge/index.mjs
          grep -Fq 'CronList' packages/harness-claude-code/dist/bridge/index.mjs
          if grep -Fq "../native-tool-kinds" packages/harness-claude-code/dist/bridge/index.mjs; then
            echo 'unexpected runtime local-module import in bridge bundle' >&2
            exit 1
          fi
      - name: Verify host artifact exposes Agent kind
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "toolUseKind: \"bash\"" packages/harness-claude-code/dist/index.js
          grep -Fq 'bypassPermissions' packages/harness-claude-code/dist/index.js
      - name: Focused exhaustive permission parity regression
        run: pnpm -C packages/harness-claude-code exec vitest --config vitest.node.config.js --run src/bridge/native-tool-kind-parity.test.ts
      - name: Full Node package tests
        run: pnpm -C packages/harness-claude-code test:node
