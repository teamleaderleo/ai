name: Fieldwork Claude permission parity matrix

on:
  push:
    branches:
      - carrier/claude-code-permission-parity-matrix-run
  pull_request:
    branches:
      - research/claude-code-permission-parity-matrix

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package type check
        run: pnpm -C packages/harness-claude-code type-check
      - name: Full public-to-bridge parity matrix
        run: pnpm -C packages/harness-claude-code test:node -- native-tool-kind-parity.fieldwork.test.ts
