name: Fieldwork 853 Chirp validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Use Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check Google Vertex
        run: pnpm --filter @ai-sdk/google-vertex type-check

      - name: Build Google Vertex
        run: pnpm --filter @ai-sdk/google-vertex build

      - name: Run focused Chirp routing control
        run: pnpm --filter @ai-sdk/google-vertex test:node -- src/google-vertex-cloud-tts-regional-routing.test.ts

      - name: Run Google Vertex Node suite
        run: pnpm --filter @ai-sdk/google-vertex test:node

      - name: Run Google Vertex Edge suite
        run: pnpm --filter @ai-sdk/google-vertex test:edge
